name: World Package Reference Integrity

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-pkg-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check world package references
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run world package reference integrity check
        id: check
        run: bun run check:world-package-references

      - name: Write job summary
        if: always()
        env:
          SUMMARY_EVENT: ${{ github.event_name }}
          SUMMARY_REF: ${{ github.ref }}
          SUMMARY_RUN_ID: ${{ github.run_id }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        run: |
          {
            printf '%s\n' '## World Package Reference Integrity Check' ''
            printf '**Trigger:** %s\n**Ref:** %s\n**Run:** %s\n\n' "$SUMMARY_EVENT" "$SUMMARY_REF" "$SUMMARY_RUN_ID"
            if [ "$CHECK_OUTCOME" = "success" ]; then
              printf '%s\n' '**Status:** ✓ All targets verified'
            else
              printf '%s\n' '**Status:** ✗ Drift or verification failure detected' '' \
                'Review the full log for target-level diagnostics.' \
                'Follow the runbook at docs/WORLD-PACKAGE-REFERENCE-RUNBOOK.md for remediation.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
