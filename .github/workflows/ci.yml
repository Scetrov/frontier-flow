name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "refactor/**"
      - "test/**"
      - "chore/**"
      - "ci/**"
      - "perf/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependabot-lockfile:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Commit updated lockfile
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if ! git check-ref-format --branch "$HEAD_REF"; then
            echo "Invalid pull request branch name"
            exit 1
          fi
          bun install
          git config user.name "dependabot[bot]"
          git config user.email "49699333+dependabot[bot]@users.noreply.github.com"
          git add bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): update bun.lock"
            git push origin "HEAD:$HEAD_REF"
          fi

  commit-messages:
    needs: dependabot-lockfile
    if: always() && (needs.dependabot-lockfile.result == 'success' || needs.dependabot-lockfile.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install ${{ !(github.event_name == 'pull_request' && startsWith(github.event.pull_request.user.login, 'dependabot')) && '--frozen-lockfile' || '' }}

      - name: Lint commit messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bun run commitlint -- --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            bun run commitlint -- --last --verbose
          else
            bun run commitlint -- --from "${{ github.event.before }}" --to "${{ github.sha }}" --verbose
          fi

  lint:
    needs: dependabot-lockfile
    if: always() && (needs.dependabot-lockfile.result == 'success' || needs.dependabot-lockfile.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install ${{ !(github.event_name == 'pull_request' && startsWith(github.event.pull_request.user.login, 'dependabot')) && '--frozen-lockfile' || '' }}

      - name: Run Oxlint
        run: bun run lint

  typecheck:
    needs: dependabot-lockfile
    if: always() && (needs.dependabot-lockfile.result == 'success' || needs.dependabot-lockfile.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install ${{ !(github.event_name == 'pull_request' && startsWith(github.event.pull_request.user.login, 'dependabot')) && '--frozen-lockfile' || '' }}

      - name: Run TypeScript build check
        run: bun run typecheck

  unit-tests:
    needs: dependabot-lockfile
    if: always() && (needs.dependabot-lockfile.result == 'success' || needs.dependabot-lockfile.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install ${{ !(github.event_name == 'pull_request' && startsWith(github.event.pull_request.user.login, 'dependabot')) && '--frozen-lockfile' || '' }}

      - name: Run Vitest suite with coverage gates
        run: bun run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore

  audit:
    needs: dependabot-lockfile
    if: always() && (needs.dependabot-lockfile.result == 'success' || needs.dependabot-lockfile.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install ${{ !(github.event_name == 'pull_request' && startsWith(github.event.pull_request.user.login, 'dependabot')) && '--frozen-lockfile' || '' }}

      - name: Run vulnerability audit
        run: bun run audit

  build:
    runs-on: ubuntu-latest
    needs:
      - commit-messages
      - lint
      - typecheck
      - unit-tests
      - audit
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install ${{ !(github.event_name == 'pull_request' && startsWith(github.event.pull_request.user.login, 'dependabot')) && '--frozen-lockfile' || '' }}

      - name: Build production bundle
        run: bun run build

  e2e:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install ${{ !(github.event_name == 'pull_request' && startsWith(github.event.pull_request.user.login, 'dependabot')) && '--frozen-lockfile' || '' }}

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          CI: true
        run: bun run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
