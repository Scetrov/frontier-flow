name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "refactor/**"
      - "test/**"
      - "chore/**"
      - "ci/**"
      - "perf/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install ${{ !startsWith(github.actor, 'dependabot') && '--frozen-lockfile' || '' }}

      - name: Commit updated lockfile (dependabot)
        if: github.event_name == 'pull_request' && startsWith(github.actor, 'dependabot')
        run: |
          bun install
          git config user.name "dependabot[bot]"
          git config user.email "49699333+dependabot[bot]@users.noreply.github.com"
          git add bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): update bun.lock"
            git push
          fi

      - name: Lint commit messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bun run commitlint -- --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            bun run commitlint -- --last --verbose
          else
            bun run commitlint -- --from "${{ github.event.before }}" --to "${{ github.sha }}" --verbose
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install ${{ !startsWith(github.actor, 'dependabot') && '--frozen-lockfile' || '' }}

      - name: Commit updated lockfile (dependabot)
        if: github.event_name == 'pull_request' && startsWith(github.actor, 'dependabot')
        run: |
          bun install
          git config user.name "dependabot[bot]"
          git config user.email "49699333+dependabot[bot]@users.noreply.github.com"
          git add bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): update bun.lock"
            git push
          fi

      - name: Run ESLint
        run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install ${{ !startsWith(github.actor, 'dependabot') && '--frozen-lockfile' || '' }}

      - name: Commit updated lockfile (dependabot)
        if: github.event_name == 'pull_request' && startsWith(github.actor, 'dependabot')
        run: |
          bun install
          git config user.name "dependabot[bot]"
          git config user.email "49699333+dependabot[bot]@users.noreply.github.com"
          git add bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): update bun.lock"
            git push
          fi

      - name: Run TypeScript build check
        run: bun run typecheck

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install ${{ !startsWith(github.actor, 'dependabot') && '--frozen-lockfile' || '' }}

      - name: Commit updated lockfile (dependabot)
        if: github.event_name == 'pull_request' && startsWith(github.actor, 'dependabot')
        run: |
          bun install
          git config user.name "dependabot[bot]"
          git config user.email "49699333+dependabot[bot]@users.noreply.github.com"
          git add bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): update bun.lock"
            git push
          fi

      - name: Run Vitest suite with coverage gates
        run: bun run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install ${{ !startsWith(github.actor, 'dependabot') && '--frozen-lockfile' || '' }}

      - name: Commit updated lockfile (dependabot)
        if: github.event_name == 'pull_request' && startsWith(github.actor, 'dependabot')
        run: |
          bun install
          git config user.name "dependabot[bot]"
          git config user.email "49699333+dependabot[bot]@users.noreply.github.com"
          git add bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): update bun.lock"
            git push
          fi

      - name: Run vulnerability audit
        run: bun run audit

  build:
    runs-on: ubuntu-latest
    needs:
      - commit-messages
      - lint
      - typecheck
      - unit-tests
      - audit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install ${{ !startsWith(github.actor, 'dependabot') && '--frozen-lockfile' || '' }}

      - name: Commit updated lockfile (dependabot)
        if: github.event_name == 'pull_request' && startsWith(github.actor, 'dependabot')
        run: |
          bun install
          git config user.name "dependabot[bot]"
          git config user.email "49699333+dependabot[bot]@users.noreply.github.com"
          git add bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): update bun.lock"
            git push
          fi

      - name: Build production bundle
        run: bun run build

  e2e:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install ${{ !startsWith(github.actor, 'dependabot') && '--frozen-lockfile' || '' }}

      - name: Commit updated lockfile (dependabot)
        if: github.event_name == 'pull_request' && startsWith(github.actor, 'dependabot')
        run: |
          bun install
          git config user.name "dependabot[bot]"
          git config user.email "49699333+dependabot[bot]@users.noreply.github.com"
          git add bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): update bun.lock"
            git push
          fi

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          CI: true
        run: bun run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
