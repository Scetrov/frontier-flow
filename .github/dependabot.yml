version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      low-risk:
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      low-risk:
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 5
